# Environment configuration.
# Terminology (used consistently across the project):
#   physics step            = one JSBSim fdm.run() (1/physics_hz seconds)
#   RL environment transition = one policy action followed by physics_hz/policy_hz physics steps
physics_hz: 120            # JSBSim integration rate
policy_hz: 10              # RL control rate  -> 12 physics steps per RL transition
target_altitude_ft: 1000   # AGL (measured above wheel-ground contact height) required for success (stable + clean)
stable_seconds: 5          # success region must hold this long (50 RL transitions at 10 Hz)
max_episode_seconds: 180   # time limit -> truncated=True (not terminated)

initial_curriculum_level: 1
default_seed: 0

observation:
  clip: 5.0                # normalized observation clip (also guarantees finite values)
  scales:                  # value / scale -> normalised
    airspeed_kt: 200.0
    ground_speed_kt: 200.0
    agl_ft: 200.0
    vertical_speed_fpm: 3000.0
    pitch_rad: 0.35
    roll_rad: 0.5
    relative_heading_rad: 0.35
    alpha_rad: 0.25
    beta_rad: 0.25
    p_rad_s: 0.3
    q_rad_s: 0.2
    r_rad_s: 0.2
    lateral_error_m: 30.0
    course_error_rad: 0.35
    distance_travelled_m: 4500.0
    distance_remaining_m: 4500.0
    cg_shift_in: 60.0
    wind_kt: 30.0
    density_ratio_center: 0.9
    density_ratio_scale: 0.2

# Takeoff-success region.  All must hold continuously for stable_seconds.
success:
  min_climb_fpm: 500.0
  max_abs_roll_deg: 8.0
  pitch_range_deg: [0.0, 20.0]
  max_heading_error_deg: 10.0
  max_alpha_deg: 12.0
  max_abs_beta_deg: 5.0
  max_lateral_m: 60.0
  min_speed_ratio_to_vs: 1.15   # airspeed >= ratio * estimated stall speed (about V2)
  # 'CLEAN' takeoff: when the stable hold completes, the whole-run cleanliness score (reward.yaml: exp(-mean((stat/scale)^2))
  # over RMS/max lateral error, RMS lateral acceleration, max roll) must be at least this, else the episode ends as
  # UNCLEAN_TAKEOFF (terminated, success=False).  0 disables the requirement.
  min_cleanliness: 0.5

# Liftoff bookkeeping.
liftoff:
  confirm_steps: 5              # consecutive RL steps with no weight-on-wheels and AGL margin
  min_agl_margin_ft: 1.0

# Failure / termination thresholds (all ESTIMATED engineering limits, configurable).
failure:
  # Sideslip is geometrically meaningless below flying speed (a parked aircraft in a crosswind has
  # |beta| up to 90 deg), so beta-based loss-of-control is only checked above this airspeed.
  aero_check_min_airspeed_kt: 50.0
  loss_of_control:
    max_abs_roll_deg: 60.0
    max_abs_pitch_deg: 45.0
    max_abs_beta_deg: 30.0
    max_ground_heading_error_deg: 45.0
    max_air_heading_error_deg: 70.0
  unstable_aoa_deg: 16.0         # airborne beyond this angle of attack -> stalled/unstable
  max_airspeed_kt: 260.0         # placard-style overspeed -> envelope violation
  max_airborne_lateral_m: 400.0  # far off the departure corridor -> envelope violation
  crash:
    touchdown_sink_fpm: 1200.0   # re-contact after liftoff faster than this -> CRASH
    touchdown_max_abs_roll_deg: 25.0
    touchdown_max_pitch_deg: 20.0
    min_agl_ft: -10.0            # below ground reference -> CRASH
  min_airborne_steps_for_return: 5   # re-contact sooner than this is treated as a bounce, not a crash
  failed_rotation_min_speed_ratio: 1.0   # runway exhausted at >= ratio*VR without lift-off -> FAILED_ROTATION
  no_acceleration:
    check_after_s: 30.0
    min_ground_speed_mps: 8.0

# Reward/termination bookkeeping labels.
failure_reasons:
  - SUCCESS
  - RUNWAY_EXCURSION
  - FAILED_ROTATION
  - INSUFFICIENT_RUNWAY
  - LOSS_OF_CONTROL
  - UNSTABLE_AFTER_LIFTOFF
  - CRASH
  - SIMULATOR_INVALID_STATE
  - ENVELOPE_VIOLATION
  - FAILED_TO_ACCELERATE
  - UNCLEAN_TAKEOFF
  - TIMEOUT

